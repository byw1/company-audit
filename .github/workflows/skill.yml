name: Skill

# Attach the installable Claude skill to every GitHub release, so people can
# download company-audit-skill.zip and add it to Claude.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/skill-zip.mjs
      - run: gh release upload "${{ github.event.release.tag_name }}" dist/company-audit-skill.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
